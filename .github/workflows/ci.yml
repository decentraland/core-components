name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    # The Redis component's `increment` runs a Lua script, which a mocked client cannot exercise —
    # mutations to it (millisecond vs second expiry, a dropped "only set the expiry when absent"
    # guard) otherwise pass every unit test while breaking the primitive in production. Specs that
    # need a real server key off `REDIS_URL` and skip without it, so local runs stay dependency-free.
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        # Pinned by commit SHA (tags are mutable). Bump deliberately when reviewing a new release.
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Setup pnpm
        # Pinned to v6.0.8 by commit SHA. Tags on third-party actions are
        # mutable; a SHA is not. Bump deliberately when reviewing a new
        # release rather than tracking a floating tag.
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8

      - name: Setup node.js
        # Pinned by commit SHA (tags are mutable). Bump deliberately when reviewing a new release.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: 'pnpm'

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check for changeset
        run: pnpm changeset status --since=origin/main

      - name: Run linting
        run: pnpm lint

      - name: Build packages
        run: pnpm build

      # Run tests only for packages that changed (and their dependents)
      - name: Run tests for changed packages
        run: pnpm --filter "...[origin/main]" run --if-present test
        env:
          REDIS_URL: redis://localhost:6379
